name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[dev]
      - name: Lint
        run: ruff check --select F robocode tests
      - name: Tests
        run: python -m pytest -q
      - name: End-to-end smoke tests
        run: |
          python -m robocode.cli demo --out out_ci
          python -m robocode.cli machine examples/square.nc --post abb --out out_ci
