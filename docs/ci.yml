name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - name: Lint (pyflakes – błędy logiczne)
        run: ruff check --select F robocode tests
      - name: Testy
        run: pytest -q
      - name: Przebieg end-to-end (demo -> KRL/RAPID + manifest)
        run: |
          python -m robocode.cli demo --out out_ci
          python -m robocode.cli machine examples/square.nc --post abb --out out_ci
